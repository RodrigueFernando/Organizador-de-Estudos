<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Nova Tarefa</title>

  <link rel="stylesheet" href="../Style/style.css">
</head>

<body>

  <div class="container">
    <div class="card">

      <h2>NOVA TAREFA DE ESTUDO</h2>

      <div class="form-group">
        <label>Matéria:</label>
        <input type="text" id="materia" placeholder="[ Matemática ]">
      </div>

      <div class="form-group">
        <label>Arquivo PDF:</label>
        <input type="file" id="pdf" accept=".pdf">
      </div>

      <div class="form-group">
        <label>Tópico:</label>
        <input type="text" id="topico" placeholder="[ Funções ]">
      </div>

      <div class="form-group">
        <label>Dificuldade:</label>
        <input type="number" id="dificuldade" placeholder="[ 3 ]">
      </div>

      <div class="form-group">
        <label>Data da prova:</label>
        <input type="text" id="dataProva" placeholder="[ 25/03/2026 ]">
      </div>

      <div class="footer">

        <button class="btn primary" onclick="salvarTarefa()">
          Salvar
        </button>

        <button class="btn outline" onclick="editarTarefa()">
          Editar
        </button>

        <button class="btn outline" onclick="voltar()">
          Voltar
        </button>

      </div>

    </div>
  </div>

  <script>

    // SALVAR TAREFA
    async function salvarTarefa() {

      // PEGAR DADOS
      const materia = document.getElementById("materia").value;
      const topico = document.getElementById("topico").value;
      const dificuldade = document.getElementById("dificuldade").value;
      const dataProva = document.getElementById("dataProva").value;

      // PEGAR PDF
      const pdf = document.getElementById("pdf").files[0];

      // VALIDAR CAMPOS
      if (
        materia === "" ||
        topico === "" ||
        dificuldade === "" ||
        dataProva === ""
      ) {

        alert("Preencha todos os campos!");
        return;

      }

      // VALIDAR PDF
      if (!pdf) {

        alert("Selecione um arquivo PDF!");
        return;

      }

      // FORM DATA
      const formData = new FormData();

      formData.append("materia", materia);
      formData.append("topico", topico);
      formData.append("dificuldade", dificuldade);
      formData.append("dataProva", dataProva);

      formData.append("pdf", pdf);

      try {

        // ENVIAR PARA O SERVER
        const resposta = await fetch("http://localhost:3000/salvar-tarefa", {

          method: "POST",
          body: formData

        });

        const dados = await resposta.json();

        // SUCESSO
        if (dados.sucesso) {

          alert("Tarefa salva com sucesso!");

          window.location.href = "planejamento.html";

        } else {

          alert("Erro ao salvar tarefa!");

        }

      } catch (erro) {

        alert("Servidor não está rodando!");

      }

    }

    // EDITAR
    function editarTarefa() {

      alert("Agora você pode editar os campos.");

    }

    // VOLTAR
    function voltar() {

      window.location.href = "planejamento.html";

    }

  </script>

</body>
</html>
