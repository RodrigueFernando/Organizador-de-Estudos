<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta charset="UTF-8">
  <title>Progresso</title>

  <link rel="stylesheet" href="./Style/style.css">

</head>

<body>

  <div class="container">

    <div class="card">

      <h2>PROGRESSO DE ESTUDO</h2>

      <p>Geral:</p>

      <div class="progresso-box" id="listaProgresso"></div>

      <br>

      <button class="btn primary" onclick="voltarMenu()">
        Voltar para o Menu
      </button>

    </div>

  </div>

  <script>

    const API_URL =
      window.location.hostname === "localhost"
        ? "http://localhost:3000"
        : "https://organizador-de-estudos-ucy2.vercel.app";

    function voltarMenu() {
      window.location.href = "planejamento.html";
    }

    async function carregarProgresso() {

      const lista = document.getElementById("listaProgresso");

      try {

        console.log("Buscando:", `${API_URL}/api/tarefas`);

        const resposta = await fetch(`${API_URL}/api/tarefas`);

        if (!resposta.ok) {
          throw new Error(`Erro HTTP ${resposta.status}`);
        }

        const tarefas = await resposta.json();

        lista.innerHTML = "<h3>Gráfico de evolução</h3>";

        if (!Array.isArray(tarefas) || tarefas.length === 0) {
          lista.innerHTML += "<p>Nenhuma tarefa cadastrada.</p>";
          return;
        }

        tarefas.forEach(tarefa => {

          const progresso = tarefa.concluida ? 100 : 0;

          lista.innerHTML += `
            <div class="item-progresso">

              <span>
                ${tarefa.materia || "Sem matéria"}:
              </span>

              <progress value="${progresso}" max="100"></progress>

              <span>
                ${progresso}%
              </span>

            </div>

            <br>
          `;

        });

      } catch (erro) {

        console.error("Erro:", erro);

        lista.innerHTML =
          "<p style='color:red;'>Erro ao carregar progresso.</p>";

      }

    }

    carregarProgresso();

  </script>

</body>
</html>
