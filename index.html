<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="./Style/style.css">
</head>

<body>

  <div class="container">
    <div class="card">
      <h2>ORGANIZADOR DE ESTUDOS</h2>

      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" placeholder="Digite seu e-mail">
      </div>

      <div class="form-group">
        <label>Senha:</label>
        <input type="password" id="senha" placeholder="Digite sua senha">
      </div>

      <a href="#" class="link">Esqueci minha senha</a>

      <div class="footer">
        <button type="button" class="btn primary" onclick="entrar()">
          Entrar
        </button>

        <button type="button" class="btn outline"
                onclick="window.location.href='./cadastro.html'">
          Cadastrar
        </button>
      </div>
    </div>
  </div>

  <script>
    // Configuração API para aceitar Localhost ou Vercel sem mexer no código
   const API_URL =
     window.location.hostname === "localhost"
     ? "http://localhost:3000"
     :"https://organizador-de-estudos-phi.vercel.app";

    async function entrar() {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if (!email || !senha) {
        alert("Preencha todos os campos!");
        return;
      }

      try {
        const resposta = await fetch(`${API_URL}/api/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, senha })
        });

        // verifica se a rota existe
      if (!resposta.ok) {
        const dadosErro = await resposta.json();

       alert(dadosErro.mensagem || "Erro ao realizar login.");
       return;
      }

      const dados = await resposta.json();

        if (dados.sucesso) {
          alert("Login realizado com sucesso!");
          window.location.href = "./planejamento.html";
        } else {
          alert(dados.mensagem || "E-mail ou senha inválidos.");
        }

      } catch (erro) {
        console.error(erro);
        alert("Erro ao conectar com o servidor.");
      }
    }
  </script>

</body>
</html>
