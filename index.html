<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="/paginas/Style/style.css">
</head>

<body>

  <div class="container">
    <div class="card">
      <h2>ORGANIZADOR DE ESTUDOS</h2>

      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" placeholder="Digite seu e-mail">
      </div>

      <div class="form-group">
        <label>Senha:</label>
        <input type="password" id="senha" placeholder="Digite sua senha">
      </div>

      <a href="#" class="link">Esqueci minha senha</a>

      <div class="footer">
        <button type="button" class="btn primary" onclick="entrar()">Entrar</button>
        <button type="button" class="btn outline" onclick="cadastrar()">Cadastrar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:3000";

    async function cadastrar() {
      alert("Clicou em cadastrar");

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if (!email || !senha) {
        alert("Preencha todos os campos!");
        return;
      }

      try {
        const resposta = await fetch(`${API_URL}/cadastrar`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, senha })
        });

        const dados = await resposta.json();
        alert(dados.mensagem);

      } catch (erro) {
        console.error(erro);
        alert("Erro ao conectar com o servidor!");
      }
    }

    async function entrar() {
      alert("Clicou em entrar");

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if (!email || !senha) {
        alert("Preencha todos os campos!");
        return;
      }

      try {
        const resposta = await fetch(`${API_URL}/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, senha })
        });

        const dados = await resposta.json();

        if (dados.sucesso) {
          alert("Login OK, vou para planejamento");
          window.location.href = "./planejamento.html";
        } else {
          alert(dados.mensagem);
        }

      } catch (erro) {
        console.error(erro);
        alert("Servidor não está rodando!");
      }
    }
  </script>

</body>
</html>
