<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Nova Tarefa</title>

  <link rel="stylesheet" href="./Style/style.css">
 </head>

<body>

  <div class="container">
    <div class="card">

      <h2>TAREFA DE ESTUDO</h2>

      <div class="form-group">
        <label>Matéria:</label>
        <input type="text" id="materia" placeholder="Matemática">
      </div>

      <div class="form-group">
        <label>Arquivo PDF:</label>
        <input type="file" id="pdf" accept=".pdf">
      </div>

      <div class="form-group">
        <label>Tópico:</label>
        <input type="text" id="topico" placeholder="Funções">
      </div>

      <div class="form-group">
        <label>Dificuldade:</label>
        <input type="number" id="dificuldade" placeholder="3">
      </div>

      <div class="form-group">
        <label>Data da prova:</label>
        <input type="date" id="dataProva">
      </div>

      <div class="footer">

        <button type="button" class="btn primary" onclick="salvarTarefa()">
          Salvar
        </button>

        <button type="button" class="btn outline" onclick="editarTarefa()">
          Editar
        </button>

        <button type="button" class="btn outline" onclick="voltar()">
          Voltar
        </button>

      </div>

    </div>
  </div>

  <script>
    const API_URL = "http://localhost:3000";

    async function salvarTarefa() {
      const materia = document.getElementById("materia").value.trim();
      const topico = document.getElementById("topico").value.trim();
      const dificuldade = document.getElementById("dificuldade").value.trim();
      const dataProva = document.getElementById("dataProva").value;
      const pdf = document.getElementById("pdf").files[0];

      if (!materia || !topico || !dificuldade || !dataProva) {
        alert("Preencha todos os campos!");
        return;
      }

      if (!pdf) {
        alert("Selecione um arquivo PDF!");
        return;
      }

      const formData = new FormData();

      formData.append("materia", materia);
      formData.append("topico", topico);
      formData.append("dificuldade", dificuldade);
      formData.append("dataProva", dataProva);
      formData.append("pdf", pdf);

      try {
        const resposta = await fetch(`${API_URL}/salvar-tarefa`, {
          method: "POST",
          body: formData
        });

        const dados = await resposta.json();

        if (dados.sucesso) {
          alert("Tarefa salva com sucesso!");
          window.location.href = "planejamento.html";
        } else {
          alert(dados.mensagem);
        }

      } catch (erro) {
        console.error(erro);
        alert("Erro ao conectar com o servidor!");
      }
    }

    function editarTarefa() {
      alert("Agora você pode editar os campos.");
    }

    function voltar() {
      window.location.href = "planejamento.html";
    }
  </script>

</body>
</html>
