<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Questionário</title>

   <link rel="stylesheet" href="/paginas/Style/style.css">
 
  <style>

    body {
      background: #eef2f5;
      font-family: Arial, sans-serif;
    }

    .questionario-card {
      max-width: 560px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.15);
    }

    .titulo-questionario {
      background: #4f9bd8;
      color: #1d2b38;
      text-align: center;
      padding: 16px;
      border-radius: 8px;
      font-size: 28px;
      font-weight: bold;
    }

    .topico-box {
      background: #e8f1fb;
      padding: 18px;
      border-radius: 10px;
      margin-top: 25px;
      font-size: 20px;
    }

    .topico-box strong {
      color: #145fae;
    }

    #pergunta {
      font-size: 22px;
      font-weight: bold;
      margin: 35px 0 25px;
    }

    #alternativas label {
      display: block;
      font-size: 20px;
      margin: 16px 0;
    }

    #alternativas input {
      width: 22px;
      height: 22px;
      margin-right: 10px;
    }

    .btn-responder {
      width: 70%;
      display: block;
      margin: 40px auto 10px;
      padding: 15px;
      background: #3478a8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 22px;
      cursor: pointer;
    }

    .btn-voltar {
      width: 70%;
      display: block;
      margin: 15px auto 0;
      padding: 12px;
      background: #ccc;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    #resultado {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

  </style>
</head>

<body>

  <div class="questionario-card">

    <div class="titulo-questionario">
      QUESTIONÁRIO
    </div>

    <div class="topico-box">

      <strong>Tópico finalizado:</strong>

      <p id="topicoFinalizado">
        Carregando...
      </p>

    </div>

    <p id="pergunta">
      Gerando pergunta com Gemini...
    </p>

    <div id="alternativas"></div>

    <button class="btn-responder" onclick="responder()">
      Responder
    </button>

    <button class="btn-voltar" onclick="voltar()">
      Voltar
    </button>

    <p id="resultado"></p>

  </div>

  <script>

    const API_URL = "http://localhost:3000";

    let perguntaAtual = null;

    let respostaSelecionada = null;

    // PEGAR ID DA URL
    const params = new URLSearchParams(window.location.search);

    const tarefaId = params.get("id");

    // CARREGAR QUESTIONÁRIO
    async function carregarQuestionario() {

      try {

        // SEM ID
        if (!tarefaId) {

          document.getElementById("topicoFinalizado").innerText =
            "Nenhuma tarefa selecionada.";

          document.getElementById("pergunta").innerText =
            "Volte ao planejamento e marque uma tarefa como concluída.";

          return;

        }

        // CHAMAR API
        const resposta = await fetch(
          `${API_URL}/gerar-questionario/${tarefaId}`
        );

        const dados = await resposta.json();

        // ERRO API
        if (!dados.sucesso) {

          document.getElementById("topicoFinalizado").innerText =
            "Erro ao carregar tópico.";

          // LIMITE GEMINI
          if (
            dados.mensagem &&
            (
              dados.mensagem.includes("quota") ||
              dados.mensagem.includes("429") ||
              dados.mensagem.includes("Too Many Requests")
            )
          ) {

            document.getElementById("pergunta").innerText =
              "Limite gratuito da IA atingido. Tente novamente mais tarde.";

            return;

          }

          document.getElementById("pergunta").innerText =
            dados.mensagem || "Erro ao gerar pergunta.";

          return;

        }

        // SALVAR PERGUNTA
        perguntaAtual = dados.questionario;

        // MOSTRAR TÓPICO
        document.getElementById("topicoFinalizado").innerText =
          `${perguntaAtual.materia} - ${perguntaAtual.topico}`;

        // MOSTRAR PERGUNTA
        mostrarPergunta();

      } catch (erro) {

        console.error(erro);

        document.getElementById("topicoFinalizado").innerText =
          "Erro.";

        document.getElementById("pergunta").innerText =
          "Erro ao carregar questionário.";

      }

    }

    // MOSTRAR PERGUNTA
    function mostrarPergunta() {

      if (!perguntaAtual) {
        return;
      }

      document.getElementById("pergunta").innerText =
        perguntaAtual.pergunta;

      const divAlternativas =
        document.getElementById("alternativas");

      divAlternativas.innerHTML = "";

      // ALTERNATIVAS
      perguntaAtual.alternativas.forEach((alternativa, index) => {

        divAlternativas.innerHTML += `

          <label>

            <input
              type="radio"
              name="alternativa"
              value="${index}"
              onchange="selecionarResposta(${index})"
            >

            ${alternativa}

          </label>

        `;

      });

    }

    // SALVAR RESPOSTA
    function selecionarResposta(index) {

      respostaSelecionada = index;

    }

    // RESPONDER
    function responder() {

      // NÃO CARREGOU
      if (!perguntaAtual) {

        alert("A pergunta ainda não foi carregada.");

        return;

      }

      // NÃO ESCOLHEU
      if (respostaSelecionada === null) {

        alert("Selecione uma alternativa!");

        return;

      }

      const resultado =
        document.getElementById("resultado");

      // ACERTOU
      if (
        Number(respostaSelecionada) ===
        Number(perguntaAtual.correta)
      ) {

        resultado.style.color = "green";

        resultado.innerText =
          "Resposta correta!";

      }

      // ERROU
      else {

        resultado.style.color = "red";

        resultado.innerText =
          "Resposta incorreta. Revise o tópico.";

      }

    }

    // VOLTAR
    function voltar() {

      window.location.href =
        "planejamento.html";

    }

    // INICIAR
    carregarQuestionario();

  </script>

</body>
</html>
