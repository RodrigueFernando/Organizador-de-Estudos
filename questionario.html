<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Questionário</title>

  <link rel="stylesheet" href="./Style/style.css">

  <style>
    body {
      background: #eef2f5;
      font-family: Arial, sans-serif;
    }

    .questionario-card {
      max-width: 560px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.15);
    }

    .titulo-questionario {
      background: #4f9bd8;
      color: #1d2b38;
      text-align: center;
      padding: 16px;
      border-radius: 8px;
      font-size: 28px;
      font-weight: bold;
    }

    .topico-box {
      background: #e8f1fb;
      padding: 18px;
      border-radius: 10px;
      margin-top: 25px;
      font-size: 20px;
    }

    .topico-box strong {
      color: #145fae;
    }

    #container-perguntas {
      margin-top: 25px;
    }

    .info-questao {
      font-size: 14px;
      color: #666;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .texto-pergunta {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0 25px;
      color: #333;
    }

    .opcao-label {
      display: block;
      font-size: 20px;
      margin: 16px 0;
      background: #f4f7f6;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: background 0.2s;
    }

    .opcao-label:hover {
      background: #eef2f5;
    }

    .opcao-label input {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      vertical-align: middle;
    }

    .btn-responder {
      width: 70%;
      display: block;
      margin: 40px auto 10px;
      padding: 15px;
      background: #3478a8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 22px;
      cursor: pointer;
    }

    .btn-voltar {
      width: 70%;
      display: block;
      margin: 15px auto 0;
      padding: 12px;
      background: #ccc;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="questionario-card">

    <div class="titulo-questionario">
      QUESTIONÁRIO
    </div>

    <div class="topico-box">
      <strong>Tópico finalizado:</strong>
      <p id="topicoFinalizado">Carregando...</p>
    </div>

    <div id="container-perguntas">
      <p class="texto-pergunta" style="text-align: center;">Gerando pergunta com Gemini...</p>
    </div>

    <button class="btn-responder" onclick="responderQuestao()">
      Responder
    </button>

    <button class="btn-voltar" onclick="voltar()">
      Voltar
    </button>

  </div>

  <script>
    // Configuração Dinâmica do Endpoint
    const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
      ? "http://localhost:3000" 
      : "https://organizador-de-estudos-ucy2.vercel.app";

    // Variáveis Globais de Controle da Paginação
    let perguntasGlobais = [];
    let indiceAtual = 0;

    // Pega o ID da tarefa vindo da URL (?id=33)
    const params = new URLSearchParams(window.location.search);
    const tarefaId = params.get("id");

    // 1. CARREGAR QUESTIONÁRIO DA API
    async function carregarQuestionario() {
      try {
        if (!tarefaId) {
          alert("ID do questionário não encontrado na URL.");
          return;
        }

        // Faz o fetch dinâmico usando o seu endpoint configurado
        const resposta = await fetch(`${API_URL}/api/gerar-questionario/${tarefaId}`);
        const dados = await resposta.json();

        console.log("Dados recebidos do servidor:", dados);

        if (dados && dados.sucesso && dados.perguntas && dados.perguntas.length > 0) {
          perguntasGlobais = dados.perguntas;
          indiceAtual = 0;

          // Atualiza o Tópico com a Matéria Real vinda do Banco (ex: GA4)
          document.getElementById("topicoFinalizado").innerText = dados.materia || perguntasGlobais[0]?.materia || "Geral";

          // Carrega a primeira questão gerada pela IA na tela
          mostrarPergunta();
        } else {
          alert("Erro ao processar questionário: " + (dados.mensagem || "Erro desconhecido"));
        }
      } catch (error) {
        console.error("Erro ao carregar questionário no front-end:", error);
        document.getElementById("container-perguntas").innerHTML = `<p class="texto-pergunta" style="color:red;">Erro ao estabelecer conexão com o servidor.</p>`;
      }
    }

    // 2. RENDERIZAR A QUESTÃO DA VEZ na tela
    function mostrarPergunta() {
      const container = document.getElementById("container-perguntas");
      if (!container || perguntasGlobais.length === 0) return;

      const item = perguntasGlobais[indiceAtual];
      let alternativasHTML = "";

      if (item.alternativas && Array.isArray(item.alternativas)) {
        item.alternativas.forEach((alt, i) => {
          alternativasHTML += `
            <label class="opcao-label">
              <input type="radio" name="opcao_questao" value="${i}">
              ${alt}
            </label>
          `;
        });
      }

      // Monta a estrutura da pergunta usando os seus estilos
      container.innerHTML = `
        <p class="info-questao">QUESTÃO ${indiceAtual + 1} DE ${perguntasGlobais.length}</p>
        <p class="texto-pergunta">${item.pergunta}</p>
        <div id="alternativas">
          ${alternativasHTML}
        </div>
      `;
    }

    // 3. VALIDAR RESPOSTA E AVANÇAR DE QUESTÃO
    function responderQuestao() {
      if (perguntasGlobais.length === 0) {
        alert("O questionário ainda não foi carregado corretamente.");
        return;
      }

      // Obtém o radio button selecionado pelo usuário
      const opcaoSelecionada = document.querySelector('input[name="opcao_questao"]:checked');

      if (!opcaoSelecionada) {
        alert("Por favor, selecione uma alternativa antes de continuar!");
        return;
      }

      const respostaDoUsuario = parseInt(opcaoSelecionada.value);
      const respostaCorreta = perguntasGlobais[indiceAtual].correta;

      // Valida o acerto
      if (respostaDoUsuario === respostaCorreta) {
        alert("Resposta correta! 🎉");
      } else {
        alert("Resposta incorreta! ❌");
      }

      // Verifica se existem mais perguntas geradas pela IA para mostrar
      if (indiceAtual < perguntasGlobais.length - 1) {
        indiceAtual++;     // Move o contador para a próxima pergunta
        mostrarPergunta(); // Renderiza a nova pergunta na tela
      } else {
        alert("Parabéns! Você finalizou o questionário. ");
        voltar();          // Redireciona de volta
      }
    }

    // 4. RETORNAR À TELA DE PLANEJAMENTO
    function voltar() {
      window.location.href = "planejamento.html";
    }

    // Executa a carga inicial quando a página abre
    carregarQuestionario();
  </script>

</body>
</html>
